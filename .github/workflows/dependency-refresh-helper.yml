name: Dependency Refresh Helper

on:
  push:
    branches:
      - agent/security-audit-2026-08-28

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-audit-2026-08-28
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Generate patched dependency lock
        shell: bash
        run: |
          npm install next@16.3.3 eslint-config-next@16.3.3 --save-exact --package-lock-only --ignore-scripts
          npm audit fix --omit=dev --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Commit refreshed lock and remove helper
        shell: bash
        run: |
          rm .github/workflows/dependency-refresh-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/dependency-refresh-helper.yml
          git commit -m "security: upgrade Next.js to patched 16.3.3"
          git push origin HEAD:agent/security-audit-2026-08-28
