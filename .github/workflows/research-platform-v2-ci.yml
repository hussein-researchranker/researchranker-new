name: ResearchRanker CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main

concurrency:
  group: researchranker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build application
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "build_exit=$BUILD_EXIT" >> "$GITHUB_ENV"
          exit 0
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: researchranker-build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: error
      - name: Enforce build result
        shell: bash
        run: exit "${build_exit:-1}"
