name: One-shot Next.js security upgrade

on:
  push:
    branches:
      - agent/platform-v2
    paths:
      - .github/workflows/next-security-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade:
    name: Upgrade Next.js to patched Active LTS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/platform-v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install patched Next.js security release
        run: npm install --save-exact next@16.3.3 eslint-config-next@16.3.3

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Remove one-shot workflow
        run: git rm .github/workflows/next-security-upgrade.yml

      - name: Commit validated security upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: upgrade Next.js to 16.3.3"
          git push origin HEAD:agent/platform-v2
