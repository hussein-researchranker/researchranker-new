name: One-shot platform hardening

on:
  push:
    branches:
      - agent/platform-v2
    paths:
      - .github/workflows/platform-hardening-one-shot.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: agent/platform-v2
          fetch-depth: 0

      - name: Patch scholarly search reliability
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def require_count(text: str, needle: str, expected: int, label: str):
              count = text.count(needle)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected}, found {count}")

          core_path = Path("app/api/global-search/core.ts")
          core = core_path.read_text(encoding="utf-8")

          cache_marker = "let scimagoCache: ScimagoJournal[] | null = null;\n"
          helper = '''let scimagoCache: ScimagoJournal[] | null = null;
          const CORE_OPENALEX_TIMEOUT_MS = 8_000;
          const CORE_CROSSREF_TIMEOUT_MS = 10_000;

          function getScholarlyUserAgent() {
            const contact = cleanText(
              process.env.RESEARCHRANKER_CONTACT_EMAIL ||
                process.env.UNPAYWALL_EMAIL ||
                ""
            );

            return contact
              ? `ResearchRanker/2.0 (mailto:${contact})`
              : "ResearchRanker/2.0 academic-search";
          }

          async function mapWithConcurrency<T, R>(
            items: T[],
            concurrency: number,
            mapper: (item: T, index: number) => Promise<R>
          ) {
            const results = new Array<R>(items.length);
            let nextIndex = 0;

            async function worker() {
              while (true) {
                const index = nextIndex;
                nextIndex += 1;

                if (index >= items.length) return;
                results[index] = await mapper(items[index], index);
              }
            }

            await Promise.all(
              Array.from(
                {
                  length: Math.min(
                    Math.max(concurrency, 1),
                    Math.max(items.length, 1)
                  ),
                },
                () => worker()
              )
            );

            return results;
          }
          '''

          if "function getScholarlyUserAgent()" not in core:
              require_count(core, cache_marker, 1, "SCImago cache marker")
              core = core.replace(cache_marker, helper, 1)

          personal_ua = '"User-Agent": "ResearchRanker/1.0 (mailto:husseinjk40@gmail.com)",'
          require_count(core, personal_ua, 3, "hard-coded scholarly User-Agent")
          core = core.replace(personal_ua, '"User-Agent": getScholarlyUserAgent(),')

          def patch_function_signal(source: str, function_name: str, timeout_constant: str):
              start = source.find(f"async function {function_name}")
              if start < 0:
                  raise SystemExit(f"{function_name}: function not found")

              next_function = source.find("\nfunction ", start + 1)
              next_async = source.find("\nasync function ", start + 1)
              candidates = [p for p in (next_function, next_async) if p >= 0]
              end = min(candidates) if candidates else len(source)
              block = source[start:end]

              if "signal: AbortSignal.timeout(" in block:
                  return source

              pattern = r'(next:\s*\{\s*revalidate:\s*60\s*\*\s*(?:60|30),\s*\},)'
              patched, count = re.subn(
                  pattern,
                  rf'\1\n    signal: AbortSignal.timeout({timeout_constant}),',
                  block,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"{function_name}: cache block for timeout not found")

              return source[:start] + patched + source[end:]

          core = patch_function_signal(core, "fetchOpenAlexByDoi", "CORE_OPENALEX_TIMEOUT_MS")
          core = patch_function_signal(core, "fetchCrossrefByDoi", "CORE_CROSSREF_TIMEOUT_MS")
          core = patch_function_signal(core, "fetchCrossrefWorks", "CORE_CROSSREF_TIMEOUT_MS")

          promise_start = "const articlesWithScimago = await Promise.all(\n  normalizedArticles.map(async (article) => {"
          promise_replacement = "const articlesWithScimago = await mapWithConcurrency(\n  normalizedArticles,\n  5,\n  async (article) => {"
          require_count(core, promise_start, 1, "OpenAlex enrichment start")
          core = core.replace(promise_start, promise_replacement, 1)

          promise_end = "    return enrichWithScimago(openAlexImprovedArticle, scimagoJournals);\n  })\n);"
          promise_end_replacement = "    return enrichWithScimago(openAlexImprovedArticle, scimagoJournals);\n  }\n);"
          require_count(core, promise_end, 1, "OpenAlex enrichment end")
          core = core.replace(promise_end, promise_end_replacement, 1)

          core_path.write_text(core, encoding="utf-8")

          search_path = Path("app/api/search/route.ts")
          search = search_path.read_text(encoding="utf-8")

          old_type = '''type MatchConfidence =
            | "Exact title match"
            | "Approximate title match"
            | "Not matched";'''
          new_type = '''type MatchConfidence =
            | "ISSN exact match"
            | "Exact title match"
            | "Approximate title match"
            | "Not matched";'''
          require_count(search, old_type, 1, "legacy match confidence type")
          search = search.replace(old_type, new_type, 1)

          normalize_tail = '''    .replace(/\\s+/g, " ")
              .trim();
          }

          function parseCsvLine'''
          normalize_replacement = '''    .replace(/\\s+/g, " ")
              .trim();
          }

          function normalizeIssn(value: string) {
            return cleanText(value)
              .replace(/[^0-9xX]/g, "")
              .toUpperCase();
          }

          function splitIssns(value: string) {
            return cleanText(value)
              .split(/[,; ]+/)
              .map(normalizeIssn)
              .filter((value) => value.length === 8);
          }

          function parseCsvLine'''
          require_count(search, normalize_tail, 1, "ISSN helper insertion")
          search = search.replace(normalize_tail, normalize_replacement, 1)

          old_matcher = '''function matchScimagoJournal(
            journalName: string,
            scimagoJournals: ScimagoJournal[]
          ): {
            journal: ScimagoJournal | null;
            confidence: MatchConfidence;
          } {
            const normalizedJournal = normalizeTitle(journalName);

            if (!normalizedJournal) {
              return {
                journal: null,
                confidence: "Not matched",
              };
            }

            const exactMatch = scimagoJournals.find(
              (scimagoJournal: ScimagoJournal) =>
                scimagoJournal.normalizedTitle === normalizedJournal
            );

            if (exactMatch) {
              return {
                journal: exactMatch,
                confidence: "Exact title match",
              };
            }

            return {
              journal: null,
              confidence: "Not matched",
            };
          }'''
          new_matcher = '''function matchScimagoJournal(
            journalName: string,
            articleIssns: string[],
            scimagoJournals: ScimagoJournal[]
          ): {
            journal: ScimagoJournal | null;
            confidence: MatchConfidence;
          } {
            const normalizedArticleIssns = articleIssns
              .map(normalizeIssn)
              .filter((value) => value.length === 8);

            if (normalizedArticleIssns.length > 0) {
              const issnMatch = scimagoJournals.find((journal) =>
                splitIssns(journal.issn).some((issn) =>
                  normalizedArticleIssns.includes(issn)
                )
              );

              if (issnMatch) {
                return {
                  journal: issnMatch,
                  confidence: "ISSN exact match",
                };
              }
            }

            const normalizedJournal = normalizeTitle(journalName);

            if (!normalizedJournal) {
              return {
                journal: null,
                confidence: "Not matched",
              };
            }

            const exactMatch = scimagoJournals.find(
              (scimagoJournal: ScimagoJournal) =>
                scimagoJournal.normalizedTitle === normalizedJournal
            );

            if (exactMatch) {
              return {
                journal: exactMatch,
                confidence: "Exact title match",
              };
            }

            return {
              journal: null,
              confidence: "Not matched",
            };
          }'''
          require_count(search, old_matcher, 1, "legacy SCImago matcher")
          search = search.replace(old_matcher, new_matcher, 1)

          record_tail = '''          source?: string;
                  pubdate?: string;
                };'''
          record_replacement = '''          source?: string;
                  pubdate?: string;
                  issn?: string;
                  essn?: string;
                };'''
          require_count(search, record_tail, 1, "PubMed record ISSNs")
          search = search.replace(record_tail, record_replacement, 1)

          match_call = '''        const scimagoMatchResult = matchScimagoJournal(
                  journal,
                  scimagoJournals
                );
                const scimagoMatch = scimagoMatchResult.journal;'''
          match_replacement = '''        const articleIssns = [record.issn, record.essn]
                  .map((value) => cleanText(value))
                  .filter(Boolean);
                const scimagoMatchResult = matchScimagoJournal(
                  journal,
                  articleIssns,
                  scimagoJournals
                );
                const scimagoMatch = scimagoMatchResult.journal;
                const verifiedByIssn =
                  scimagoMatchResult.confidence === "ISSN exact match";'''
          require_count(search, match_call, 1, "PubMed SCImago call")
          search = search.replace(match_call, match_replacement, 1)

          metrics = '''          quartile: scimagoMatch?.quartile || "Not found",
                  indexingStatus: buildIndexingStatus(scimagoMatch, "PubMed"),
                  sjr: scimagoMatch?.sjr || "",
                  hIndex: scimagoMatch?.hIndex || "",
                  publisher: scimagoMatch?.publisher || "",
                  issn: scimagoMatch?.issn || "",
                  matchConfidence: scimagoMatchResult.confidence,'''
          metrics_replacement = '''          quartile: verifiedByIssn
                    ? scimagoMatch?.quartile || "Not found"
                    : "Not found",
                  indexingStatus: verifiedByIssn
                    ? buildIndexingStatus(scimagoMatch, "PubMed")
                    : scimagoMatch
                      ? "SCImago title candidate only - quartile not verified by ISSN"
                      : buildIndexingStatus(null, "PubMed"),
                  sjr: verifiedByIssn ? scimagoMatch?.sjr || "" : "",
                  hIndex: verifiedByIssn ? scimagoMatch?.hIndex || "" : "",
                  publisher: verifiedByIssn ? scimagoMatch?.publisher || "" : "",
                  issn: articleIssns.join(", "),
                  matchConfidence: scimagoMatchResult.confidence,'''
          require_count(search, metrics, 1, "PubMed verified metrics")
          search = search.replace(metrics, metrics_replacement, 1)

          search_path.write_text(search, encoding="utf-8")

          advanced_path = Path("app/advanced-search/page.tsx")
          advanced = advanced_path.read_text(encoding="utf-8")
          old_union = '''type MatchConfidenceFilter =
            | "All"
            | "Exact title match"
            | "Approximate title match"
            | "Not matched";'''
          new_union = '''type MatchConfidenceFilter =
            | "All"
            | "ISSN exact match"
            | "Exact title match"
            | "Approximate title match"
            | "Not matched";'''
          require_count(advanced, old_union, 1, "advanced-search confidence union")
          advanced = advanced.replace(old_union, new_union, 1)

          old_filters = '''const matchConfidenceFilters: MatchConfidenceFilter[] = [
            "All",
            "Exact title match",
            "Approximate title match",
            "Not matched",
          ];'''
          new_filters = '''const matchConfidenceFilters: MatchConfidenceFilter[] = [
            "All",
            "ISSN exact match",
            "Exact title match",
            "Approximate title match",
            "Not matched",
          ];'''
          require_count(advanced, old_filters, 1, "advanced-search confidence filters")
          advanced = advanced.replace(old_filters, new_filters, 1)
          advanced_path.write_text(advanced, encoding="utf-8")
          PY

      - name: Verify source invariants
        shell: bash
        run: |
          ! grep -R "husseinjk40@gmail.com" app lib --include='*.ts' --include='*.tsx'
          grep -q 'mapWithConcurrency' app/api/global-search/core.ts
          grep -q 'CORE_OPENALEX_TIMEOUT_MS' app/api/global-search/core.ts
          grep -q 'ISSN exact match' app/api/search/route.ts

      - name: Remove one-shot workflow before commit
        shell: bash
        run: rm .github/workflows/platform-hardening-one-shot.yml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Commit hardening changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "hardening: bound scholarly enrichment and enforce ISSN evidence"
          git push origin HEAD:agent/platform-v2