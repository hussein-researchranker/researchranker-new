name: Journal Matching Refactor Helper

on:
  push:
    branches:
      - agent/journal-matching-regression-tests-2026-08-28

permissions:
  contents: write

jobs:
  refactor-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/journal-matching-regression-tests-2026-08-28
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Route production matching through tested module
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/api/global-search/route.ts")
          text = path.read_text()

          import_anchor = '''} from "@/lib/search-guardrails.mjs";

          export const runtime = "nodejs";'''
          import_replacement = '''} from "@/lib/search-guardrails.mjs";
          import {
            findScimagoMatch,
            getTitleTokens,
            normalizeJournalTitle,
            splitIssns,
          } from "@/lib/journal-matching.mjs";

          export const runtime = "nodejs";'''
          if import_anchor not in text:
              raise SystemExit("Import anchor not found")
          text = text.replace(import_anchor, import_replacement, 1)

          issn_block = '''function normalizeIssn(value: string) {
            return cleanText(value)
              .replace(/[^0-9xX]/g, "")
              .toUpperCase();
          }

          function splitIssns(value: string) {
            return cleanText(value)
              .split(/[,; ]+/)
              .map(normalizeIssn)
              .filter(Boolean);
          }

          '''
          if issn_block not in text:
              raise SystemExit("ISSN helper block not found")
          text = text.replace(issn_block, "", 1)

          title_block = '''function normalizeJournalTitle(value: string) {
            return cleanText(value)
              .toLowerCase()
              .replace(/&/g, "and")
              .replace(/\\bthe\\b/g, "")
              .replace(/\\bjournal of\\b/g, "journal")
              .replace(/\\binternational journal of\\b/g, "international journal")
              .replace(/\\bproceedings of\\b/g, "proceedings")
              .replace(/\\btransactions on\\b/g, "transactions")
              .replace(/\\bmagazine\\b/g, "")
              .replace(/\\bletters\\b/g, "")
              .replace(/\\breview\\b/g, "")
              .replace(/[^a-z0-9]+/g, " ")
              .replace(/\\s+/g, " ")
              .trim();
          }

          function getTitleTokens(value: string) {
            const stopWords = new Set([
              "and",
              "of",
              "the",
              "in",
              "on",
              "for",
              "to",
              "a",
              "an",
              "journal",
              "international",
            ]);

            return normalizeJournalTitle(value)
              .split(" ")
              .filter((token) => token.length >= 3 && !stopWords.has(token));
          }

          function tokenSimilarity(a: string[], b: string[]) {
            if (!a.length || !b.length) return 0;

            const aSet = new Set(a);
            const bSet = new Set(b);

            const intersection = [...aSet].filter((token) => bSet.has(token)).length;
            const union = new Set([...aSet, ...bSet]).size;

            return union === 0 ? 0 : intersection / union;
          }

          '''
          if title_block not in text:
              raise SystemExit("Title matching helper block not found")
          text = text.replace(title_block, "", 1)

          start = text.find("function findScimagoMatch(")
          end = text.find("function enrichWithScimago(", start)
          if start == -1 or end == -1:
              raise SystemExit("findScimagoMatch block boundaries not found")
          text = text[:start] + text[end:]

          path.write_text(text)
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit verified refactor and remove helper
        shell: bash
        run: |
          rm .github/workflows/journal-matching-refactor-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/global-search/route.ts .github/workflows/journal-matching-refactor-helper.yml
          git commit -m "test: route SCImago identification through regression-tested matcher"
          git push origin HEAD:agent/journal-matching-regression-tests-2026-08-28
